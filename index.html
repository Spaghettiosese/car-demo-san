<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAN DEMO — Driving Sandbox</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="hurt"></div>

  <!-- in-game HUD -->
  <div id="hud" class="hidden">
    <div id="hud-tl">
      <div id="loc-street">San Demo</div>
      <div id="loc-sub"></div>
    </div>
    <div id="hud-tr">
      <div id="wanted"></div>
      <div id="wanted-bar"><div class="fill"></div><span></span></div>
      <div id="timer-box" class="hidden"></div>
    </div>
    <div id="hud-bl">
      <canvas id="minimap" width="200" height="200"></canvas>
      <canvas id="damage-canvas" width="84" height="150"></canvas>
    </div>
    <div id="hud-br">
      <canvas id="speedo" width="250" height="250"></canvas>
    </div>
    <div id="tell-tales"></div>
    <div id="crosshair"></div>
    <div id="hover-label"></div>
    <div id="prompt"></div>
    <div id="toasts"></div>
    <div id="bigmsg"><div class="big"></div><div class="small"></div></div>
    <div id="radio-display"></div>
    <div id="telemetry" class="hidden"></div>
    <div id="speech-layer"></div>
    <div id="cam-name"></div>
  </div>

  <!-- full screen map -->
  <div id="map-full" class="overlay hidden">
    <canvas id="map-canvas" width="900" height="900"></canvas>
    <div class="map-hint">Click to set a GPS waypoint · Right-click to clear · M to close</div>
  </div>

  <!-- menus are generated by js/ui/menus.js -->
  <div id="menu-root"></div>
  <div id="garage-ui" class="hidden"></div>

  <div id="help" class="overlay hidden"></div>
  <div id="fade"></div>
  <div id="loading"><div class="logo">SAN DEMO</div><div class="bar"><div class="fill"></div></div><div class="msg">Building the city…</div></div>
</div>
<noscript>This game needs JavaScript and WebGL.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
